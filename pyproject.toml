[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egm-hermes"
version = "1.0.0"
description = "Elephant-Goldfish Model plugin for Hermes Agent"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "raffieeey"}]

[tool.setuptools]
packages = ["egm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
